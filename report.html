
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم بلاغ كهربائي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>⚡ نظام بلاغات أعطال الكهرباء</h1>
    <nav>
        <a href="main.html">الرئيسية</a> |
        <a href="index.html">تسجيل الخروج</a> |
        <a href="report.html">تقديم بلاغ</a> |
        <a href="track.html">متابعة البلاغات</a> |
        <a href="contact.html">تواصل معنا</a>
    </nav>
</header>

<hr>

<main>
    <h2>تقديم بلاغ عن عطل كهربائي</h2>

    <form id="reportForm" action="#" method="POST">
        <label for="name">الاسم الكامل:</label>
        <br>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="phone">رقم الهاتف:</label>
        <br>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <label for="location">المنطقة وموقع العطل:</label>
        <br>
        <input type="text" id="location" name="location" required>

        <br><br>

        <label for="fault">نوع العطل:</label>
        <br>
        <select id="fault" name="fault" required>
            <option value="">اختر نوع العطل</option>
            <option value="outage">انقطاع الكهرباء</option>
            <option value="wires">أسلاك تالفة</option>
            <option value="transformer">عطل في المحول</option>
            <option value="other">عطل آخر</option>
        </select>

        <br><br>

        <label for="description">وصف العطل:</label>
        <br>
        <textarea id="description" name="description"
                  rows="5" required></textarea>

        <br><br>

        <button type="submit">إرسال البلاغ</button>
    </form>

    <p><a href="main.html">العودة إلى الصفحة الرئيسية</a></p>
</main>

<script src="home.js"></script>
</body>
</html>
