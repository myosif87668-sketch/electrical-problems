<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="إنشاء حساب جديد في نظام بلاغات أعطال الكهرباء">

    <title>إنشاء حساب جديد - نظام بلاغات الكهرباء</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- رأس الصفحة -->
    <header>

        <h1>⚡ نظام بلاغات أعطال الكهرباء</h1>

        <p>
            إنشاء حساب جديد
        </p>

    </header>


    <!-- المحتوى الرئيسي -->
    <main>

        <section>

            <h2>إنشاء حساب جديد</h2>

            <p>
                مرحباً بك، يرجى إدخال بياناتك لإنشاء حساب.
            </p>


            <!-- نموذج إنشاء الحساب -->
            <form action="#" method="">

                <!-- الاسم الكامل -->
                <div>

                    <label for="fullname">
                        الاسم الكامل
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="أدخل اسمك الكامل"
                        required>

                </div>


                <!-- البريد الإلكتروني -->
                <div>

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required>

                </div>


                <!-- رقم الهاتف -->
                <div>

                    <label for="phone">
                        رقم الهاتف
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="أدخل رقم هاتفك"
                        required>

                </div>


                <!-- كلمة المرور -->
                <div>

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        minlength="8"
                        required>

                </div>


                <!-- تأكيد كلمة المرور -->
                <div>

                    <label for="confirm_password">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="أعد كتابة كلمة المرور"
                        minlength="8"
                        required>

                </div>


                <!-- زر إنشاء الحساب -->
                <button type="submit">
                    إنشاء الحساب
                </button>

            </form>

        </section>


        <!-- العودة إلى تسجيل الدخول -->
        <section>

            <p>
                لديك حساب بالفعل؟

                <a href="index.html">
                    تسجيل الدخول
                </a>
            </p>

        </section>

    </main>


    <!-- تذييل الصفحة -->
    <footer>

        <p>
            جميع الحقوق محفوظة
            &copy;
            نظام بلاغات أعطال الكهرباء
        </p>

    </footer>

</body>

</html>
